services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconriver}
      POSTGRES_USER: ${POSTGRES_USER:-reconriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconriver_local_only}
    ports:
      - "5432:5432"
    volumes:
      - reconriver-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconriver} -d ${POSTGRES_DB:-reconriver}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  reconriver-postgres:
